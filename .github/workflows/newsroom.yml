name: Australia By Aussie Newsroom

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: australia-by-aussie-newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check requests feedparser beautifulsoup4

      - name: Select current OpenRouter model fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("newsroom.py")
          s = p.read_text(encoding="utf-8")
          old = '''OPENROUTER_MODELS = [
              "google/gemma-4-26b-a4b-it:free",
              "openrouter/free"
          ]'''
          new = '''OPENROUTER_MODELS = [
              "google/gemma-4-31b-it:free",
              "openai/gpt-oss-120b:free",
              "openrouter/free"
          ]'''
          if old not in s:
              raise SystemExit("Expected OpenRouter model list was not found; refusing to run with an unknown configuration.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("OpenRouter model fallback configured: Gemma 4 31B -> GPT-OSS 120B -> free router")
          PY

      - name: Run Australia By Aussie Newsroom
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python newsroom.py

      - name: Save newsroom state
        run: |
          git config user.name "Australia By Aussie Newsroom"
          git config user.email "newsroom@australiabyaussie.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update newsroom state"
            git push
          fi
