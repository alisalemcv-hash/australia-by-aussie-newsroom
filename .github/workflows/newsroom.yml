name: Australia By Aussie Newsroom

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: australia-by-aussie-newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check requests feedparser beautifulsoup4

      - name: Configure resilient OpenRouter fallback and validation repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("newsroom.py")
          s = p.read_text(encoding="utf-8")

          old = '''OPENROUTER_MODELS = [
              "google/gemma-4-26b-a4b-it:free",
              "openrouter/free"
          ]'''
          new = '''OPENROUTER_MODELS = [
              "openrouter/free",
              "nvidia/nemotron-3-ultra-550b-a55b:free",
              "google/gemma-4-26b-a4b-it:free",
              "openai/gpt-oss-20b:free"
          ]'''
          if old not in s:
              raise SystemExit("Expected OpenRouter model list was not found; refusing to run with an unknown newsroom.py version.")
          s = s.replace(old, new, 1)

          old_provider = '"provider": {"require_parameters": True}'
          new_provider = '"provider": {"require_parameters": True, "allow_fallbacks": True},\n            "plugins": [{"id": "response-healing"}]'
          if old_provider not in s:
              raise SystemExit("Expected OpenRouter provider configuration was not found; refusing to run with an unknown newsroom.py version.")
          s = s.replace(old_provider, new_provider, 1)

          repair_function = r'''

def repair_exact_excerpt(result, story):
    """Guarantee the website excerpt contains exactly 25 English words.

    Models sometimes miss a hard word-count constraint even when JSON schema
    validation succeeds. Repair the prose deterministically from the model
    excerpt first, then the verified Guardian description/article text.
    """
    website = result.get("website", {})
    excerpt = clean_text(website.get("excerpt", ""))
    if len(count_english_words(excerpt)) == 25:
        website["excerpt"] = excerpt
        return

    source_parts = [excerpt, story.get("description", ""), story.get("text", ""), story.get("title", "")]
    source = clean_text(" ".join(part for part in source_parts if part))
    words = count_english_words(source)
    if len(words) < 25:
        raise ValueError("Unable to deterministically construct a 25-word excerpt from supplied source material")

    website["excerpt"] = " ".join(words[:25])
    print("Excerpt repaired automatically to exactly 25 English words.")
'''

          marker = '\ndef validate_story(story):\n'
          if 'def repair_exact_excerpt(result, story):' not in s:
              if marker not in s:
                  raise SystemExit("validate_story marker not found; refusing to patch unknown newsroom.py version.")
              s = s.replace(marker, repair_function + marker, 1)

          old_validate = '        validate_story(result)\n'
          new_validate = '        repair_exact_excerpt(result, story)\n        validate_story(result)\n'
          if old_validate not in s:
              raise SystemExit("validate_story call not found; refusing to patch unknown newsroom.py version.")
          s = s.replace(old_validate, new_validate, 1)

          p.write_text(s, encoding="utf-8")
          print("OpenRouter configured: free router -> Nemotron 3 Ultra -> Gemma 4 26B -> GPT-OSS 20B")
          print("Response Healing enabled")
          print("Exact 25-word excerpt repair enabled")
          PY

      - name: Run Australia By Aussie Newsroom
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python newsroom.py

      - name: Save newsroom state
        run: |
          git config user.name "Australia By Aussie Newsroom Newsroom"
          git config user.email "newsroom@australiabyaussie.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update newsroom state"
            git push
          fi
